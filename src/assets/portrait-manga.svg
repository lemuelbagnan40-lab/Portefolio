<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 100 640 640" width="640" height="640" role="img" aria-labelledby="pm-title">
  <title id="pm-title">Portrait manga : jeune homme, nuit chaude, encre et trame</title>

  <defs>
    <radialGradient id="halo" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#2A4034" />
      <stop offset="70%" stop-color="#1B2C24" />
      <stop offset="100%" stop-color="#101A15" />
    </radialGradient>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9A276" />
      <stop offset="55%" stop-color="#C78E63" />
      <stop offset="100%" stop-color="#B77C54" />
    </linearGradient>

    <linearGradient id="hoodie" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#2B4034" />
      <stop offset="100%" stop-color="#17261F" />
    </linearGradient>

    <pattern id="trame" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2.2" cy="2.2" r="1.15" fill="#221A14" />
    </pattern>

    <pattern id="trame-cream" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#F3EBDD" />
    </pattern>

